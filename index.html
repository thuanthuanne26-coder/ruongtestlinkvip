<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RUONGTESTLINKVIP</title>
    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: #151b26;
            --text-main: #f0f6fc;
            --text-sub: #8b949e;
            --accent: #f72585;
            --accent-hover: #b5179e;
            --neon-glow: rgba(247, 37, 133, 0.4);
            --error: #ff4d4d;
            --success: #4ade80;
            --border: #30363d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at 50% 0%, rgba(247, 37, 133, 0.15), transparent 70%);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        .container {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 25px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 0 25px var(--neon-glow);
            text-align: center;
            position: relative;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(74, 222, 128, 0.1);
            color: var(--success);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            margin-bottom: 15px;
            border: 1px solid rgba(74, 222, 128, 0.2);
        }
        .status-dot {
            width: 6px;
            height: 6px;
            background-color: var(--success);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--success);
        }

        .title {
            color: var(--text-main);
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 1.5px;
            margin-bottom: 20px;
            text-shadow: 0 0 10px var(--accent);
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-field {
            width: 100%;
            padding: 14px;
            background-color: var(--bg-color);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text-main);
            font-size: 14px;
            outline: none;
            text-align: center;
            transition: all 0.3s;
        }

        .input-field:focus {
            border-color: var(--accent);
            box-shadow: 0 0 10px var(--neon-glow);
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--accent), var(--accent-hover));
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.2s;
            user-select: none;
            -webkit-user-select: none;
        }

        .btn-submit:hover {
            box-shadow: 0 0 15px var(--neon-glow);
        }

        .btn-submit:active {
            transform: scale(0.98);
        }

        .message-box {
            margin-top: 15px;
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
            display: none;
            word-break: break-word;
        }

        .message-box.error {
            display: block;
            background-color: rgba(255, 77, 77, 0.1);
            color: var(--error);
            border: 1px solid rgba(255, 77, 77, 0.2);
        }

        .message-box.success {
            display: block;
            background-color: rgba(74, 222, 128, 0.1);
            color: var(--success);
            border: 1px solid rgba(74, 222, 128, 0.2);
        }

        /* TRANG 2: Giao diện quét live rương test */
        .dashboard-section {
            text-align: left;
        }

        .session-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-color);
            padding: 10px 14px;
            border-radius: 10px;
            border: 1px solid var(--border);
            margin-bottom: 15px;
            font-size: 12px;
        }

        .live-room-list {
            max-height: 280px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 15px;
        }

        .live-card {
            background: var(--bg-color);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 10px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: border-color 0.2s;
        }

        .live-card:hover {
            border-color: var(--accent);
        }

        .live-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .room-icon {
            background: rgba(247, 37, 133, 0.2);
            color: var(--accent);
            width: 36px;
            height: 36px;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 11px;
            border: 1px solid rgba(247, 37, 133, 0.4);
        }

        .room-details {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .room-name {
            font-size: 13px;
            font-weight: bold;
            color: var(--text-main);
        }

        .room-meta {
            font-size: 11px;
            color: var(--text-sub);
        }

        .live-right {
            text-align: right;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 4px;
        }

        .countdown-tag {
            background: rgba(255, 235, 59, 0.1);
            color: #ffeb3b;
            border: 1px solid rgba(255, 235, 59, 0.3);
            padding: 2px 6px;
            border-radius: 6px;
            font-size: 11px;
            font-family: monospace;
            font-weight: bold;
        }

        .btn-join {
            background: var(--success);
            color: #0b0e14;
            border: none;
            padding: 4px 10px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 11px;
            cursor: pointer;
            text-decoration: none;
        }

        .btn-join:hover {
            opacity: 0.9;
        }

        /* Modal Admin chung */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(4px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-window {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 25px;
            width: 90%;
            max-width: 420px;
            position: relative;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        .modal-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 15px;
        }

        .btn-close {
            position: absolute;
            top: 12px;
            right: 15px;
            background: none;
            border: none;
            color: var(--text-sub);
            font-size: 20px;
            cursor: pointer;
        }

        .btn-generate {
            background: #238636;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            margin-bottom: 15px;
            width: 100%;
        }

        .key-list {
            max-height: 200px;
            overflow-y: auto;
            margin: 15px 0;
            text-align: left;
        }

        .key-item {
            background: var(--bg-color);
            border: 1px solid var(--border);
            padding: 10px 12px;
            margin-bottom: 10px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .key-info {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .key-code {
            font-family: monospace;
            font-weight: bold;
            font-size: 12px;
            color: var(--accent);
        }

        .key-expire {
            font-size: 10px;
            color: var(--text-sub);
        }

        .action-btns {
            display: flex;
            gap: 6px;
        }

        .btn-copy {
            background: #30363d;
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 11px;
        }

        .btn-delete {
            background-color: var(--error);
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 11px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="status-badge">
            <span class="status-dot"></span> HỆ THỐNG HOẠT ĐỘNG
        </div>
        <h2 class="title">RUONGTESTLINKVIP</h2>

        <!-- Khung Nhập Key Người Dùng -->
        <div id="loginSection">
            <div class="input-group">
                <input type="text" id="keyInput" class="input-field" placeholder="Nhập key kích hoạt...">
            </div>
            
            <button class="btn-submit" id="holdBtn">KÍCH HOẠT KEY</button>
            <div id="msgBox" class="message-box"></div>
        </div>

        <!-- TRANG 2: Tự động quét Live rương test < 20s (Phong cách vohoainam / livemira) -->
        <div id="activeSection" style="display: none;" class="dashboard-section">
            <div class="session-info">
                <div>
                    <span style="color: var(--text-sub);">Key hạn:</span> <strong id="activeKeyDisplay" style="color: var(--accent);">VIP</strong>
                </div>
                <div>
                    <span style="color: var(--text-sub);">Hết hạn sau:</span> <strong id="countdownDisplay" style="color: var(--success);">60:00</strong>
                </div>
            </div>

            <p style="font-size: 12px; color: var(--text-sub); margin-bottom: 10px; text-align: center;">
                🔥 Đang quét LiveMira (Rương 20/16 tự động làm mới mỗi 2s):
            </p>

            <!-- Danh sách phòng live rương test dưới 20s -->
            <div class="live-room-list" id="liveRoomList">
                <!-- Javascript sẽ render tự động các phòng live rương test ở đây -->
            </div>
        </div>
    </div>

    <!-- Modal Nhập Password Admin -->
    <div class="modal-overlay" id="adminAuthModal">
        <div class="modal-window">
            <button class="btn-close" onclick="closeModal('adminAuthModal')">&times;</button>
            <h3 class="modal-title">XÁC NHẬN ADMIN</h3>
            <div class="input-group">
                <input type="password" id="adminPassInput" class="input-field" placeholder="Nhập mật khẩu Admin...">
            </div>
            <button class="btn-submit" onclick="verifyAdminPassword()">XÁC NHẬN</button>
        </div>
    </div>

    <!-- Modal Bảng Quản Lý Admin -->
    <div class="modal-overlay" id="adminPanelModal">
        <div class="modal-window">
            <button class="btn-close" onclick="closeModal('adminPanelModal')">&times;</button>
            <h3 class="modal-title">QUẢN LÝ KEY ADMIN</h3>
            
            <button class="btn-generate" onclick="generateNewKey()">+ TẠO KEY VIP MỚI (HẠN 1 NGÀY)</button>
            
            <div class="key-list" id="keyListContainer"></div>
            
            <button class="btn-submit" onclick="closeModal('adminPanelModal')" style="background: var(--border);">ĐÓNG BẢNG</button>
        </div>
    </div>

<script>
    let holdTimer;
    let holdCount = 0;
    let failCount = 0;
    const maxFails = 5;
    let currentActiveKey = null;
    let liveRefreshInterval = null;

    const holdBtn = document.getElementById('holdBtn');
    const msgBox = document.getElementById('msgBox');
    const keyInput = document.getElementById('keyInput');

    if (!localStorage.getItem('adminKeysData')) {
        const defaultKeys = [
            { key: 'FREE-AGVP-85DD-VDU5-MPH2', expire: Date.now() + 86400000 },
            { key: 'FREE-DXZW-9BNW-6KRD-VMQB', expire: Date.now() + 86400000 }
        ];
        localStorage.setItem('adminKeysData', JSON.stringify(defaultKeys));
    }

    function showMessage(text, type) {
        msgBox.className = `message-box ${type}`;
        msgBox.innerText = text;
    }

    // Giữ nút ngầm 30s mở bảng Admin
    const startHold = (e) => {
        holdCount = 30;
        holdTimer = setInterval(() => {
            holdCount--;
            if (holdCount <= 0) {
                clearInterval(holdTimer);
                msgBox.style.display = "none";
                document.getElementById('adminAuthModal').style.display = 'flex';
                document.getElementById('adminPassInput').value = '';
                document.getElementById('adminPassInput').focus();
            }
        }, 1000);
    };

    const cancelHold = () => { clearInterval(holdTimer); };

    holdBtn.addEventListener('mousedown', startHold);
    holdBtn.addEventListener('mouseup', cancelHold);
    holdBtn.addEventListener('mouseleave', cancelHold);
    holdBtn.addEventListener('touchstart', startHold);
    holdBtn.addEventListener('touchend', cancelHold);

    // Kích hoạt Key vào trang 2
    holdBtn.addEventListener('click', () => {
        if (holdCount < 30 && holdCount > 0) return;

        const enteredKey = keyInput.value.trim();
        if (!enteredKey) {
            showMessage("Vui lòng nhập key hợp lệ!", "error");
            return;
        }

        let savedKeys = JSON.parse(localStorage.getItem('adminKeysData')) || [];
        const foundKey = savedKeys.find(item => item.key === enteredKey);

        if (foundKey) {
            if (Date.now() > foundKey.expire) {
                showMessage("Key này đã hết hạn 1 ngày sử dụng!", "error");
                return;
            }
            currentActiveKey = enteredKey;
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('activeSection').style.display = 'block';
            document.getElementById('activeKeyDisplay').innerText = enteredKey.substring(0, 12) + '...';
            
            startSessionTimer(60 * 60);
            startLiveMiraScanner(); // Chạy bộ quét tự động tải lại rương test <20s
        } else {
            failCount++;
            showMessage(`Key không đúng hoặc đã bị hủy! (${failCount}/${maxFails})`, "error");
        }
    });

    // Tạo key mới ngẫu nhiên
    function generateNewKey() {
        const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
        const segment = () => Array.from({length: 4}, () => chars.charAt(Math.floor(Math.random() * chars.length))).join('');
        const newKeyCode = `FREE-${segment()}-${segment()}-${segment()}-${segment()}`;
        
        const expireTime = Date.now() + (24 * 60 * 60 * 1000);
        let keys = JSON.parse(localStorage.getItem('adminKeysData')) || [];
        keys.push({ key: newKeyCode, expire: expireTime });
        localStorage.setItem('adminKeysData', JSON.stringify(keys));
        renderKeyList();
    }

    function verifyAdminPassword() {
        const pass = document.getElementById('adminPassInput').value.trim();
        if (pass === "THUANDEPTRAI") {
            closeModal('adminAuthModal');
            openAdminPanel();
        } else {
            alert("Sai mật khẩu Admin!");
        }
    }

    function openAdminPanel() {
        document.getElementById('adminPanelModal').style.display = 'flex';
        renderKeyList();
    }

    function renderKeyList() {
        let keys = JSON.parse(localStorage.getItem('adminKeysData')) || [];
        const container = document.getElementById('keyListContainer');

        if (keys.length === 0) {
            container.innerHTML = '<p style="font-size: 13px; color: var(--text-sub); text-align: center;">Chưa có key nào.</p>';
            return;
        }

        let html = '';
        keys.forEach((item, index) => {
            const expireDate = new Date(item.expire).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) + ' - ' + new Date(item.expire).toLocaleDateString();
            html += `
                <div class="key-item">
                    <div class="key-info">
                        <span class="key-code">${item.key}</span>
                        <span class="key-expire">Hạn: ${expireDate}</span>
                    </div>
                    <div class="action-btns">
                        <button class="btn-copy" onclick="copyKey('${item.key}')">Copy</button>
                        <button class="btn-delete" onclick="deleteKey(${index}, '${item.key}')">Xóa</button>
                    </div>
                </div>
            `;
        });
        container.innerHTML = html;
    }

    function copyKey(text) {
        navigator.clipboard.writeText(text);
        alert("Đã sao chép key: " + text);
    }

    // Xóa Key & Đá văng người dùng về trang 1
    function deleteKey(index, keyVal) {
        let keys = JSON.parse(localStorage.getItem('adminKeysData')) || [];
        keys.splice(index, 1);
        localStorage.setItem('adminKeysData', JSON.stringify(keys));
        renderKeyList();

        if (currentActiveKey === keyVal) {
            kickToHome();
        }
    }

    function kickToHome() {
        document.getElementById('activeSection').style.display = 'none';
        document.getElementById('loginSection').style.display = 'block';
        keyInput.value = '';
        showMessage("Admin đã xóa key!", "error");
        currentActiveKey = null;
        if (liveRefreshInterval) clearInterval(liveRefreshInterval);
    }

    function closeModal(id) {
        document.getElementById(id).style.display = 'none';
    }

    window.addEventListener('storage', () => {
        if (currentActiveKey) {
            let keys = JSON.parse(localStorage.getItem('adminKeysData')) || [];
            let exists = keys.some(k => k.key === currentActiveKey);
            if (!exists) kickToHome();
        }
    });

    // Bộ đếm ngược phiên làm việc trang 2
    function startSessionTimer(duration) {
        let timer = duration, minutes, seconds;
        const display = document.getElementById('countdownDisplay');
        const interval = setInterval(() => {
            minutes = parseInt(timer / 60, 10);
            seconds = parseInt(timer % 60, 10);
            display.textContent = (minutes < 10 ? "0" + minutes : minutes) + ":" + (seconds < 10 ? "0" + seconds : seconds);
            if (--timer < 0) {
                clearInterval(interval);
                kickToHome();
            }
