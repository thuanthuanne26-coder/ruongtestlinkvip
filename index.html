<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RUONGTESTLINKVIP</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --text-main: #c9d1d9;
            --text-sub: #8b949e;
            --accent: #f72585;
            --accent-hover: #b5179e;
            --error: #ff4d4d;
            --success: #4ade80;
            --border: #30363d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 30px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .title {
            color: var(--accent);
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 1.5px;
            margin-bottom: 25px;
            text-transform: uppercase;
            word-break: break-word;
        }

        .input-group {
            margin-bottom: 18px;
        }

        .input-field {
            width: 100%;
            padding: 14px;
            background-color: var(--bg-color);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text-main);
            font-size: 14px;
            outline: none;
            text-align: center;
            transition: border-color 0.2s;
        }

        .input-field:focus {
            border-color: var(--accent);
        }

        .btn-submit {
            position: relative;
            width: 100%;
            padding: 14px;
            background-color: var(--accent);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            user-select: none;
            -webkit-user-select: none;
        }

        .btn-submit:hover {
            background-color: var(--accent-hover);
        }

        .btn-submit:active {
            transform: scale(0.98);
        }

        .timer-badge {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 11px;
            font-weight: normal;
            background: rgba(0, 0, 0, 0.4);
            padding: 3px 7px;
            border-radius: 12px;
            color: #ffeb3b;
        }

        .message-box {
            margin-top: 15px;
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
            display: none;
            word-break: break-word;
        }

        .message-box.error {
            display: block;
            background-color: rgba(255, 77, 77, 0.1);
            color: var(--error);
            border: 1px solid rgba(255, 77, 77, 0.2);
        }

        .message-box.success {
            display: block;
            background-color: rgba(74, 222, 128, 0.1);
            color: var(--success);
            border: 1px solid rgba(74, 222, 128, 0.2);
        }

        /* Màn hình đã kích hoạt key thành công */
        .timer-box {
            background-color: var(--bg-color);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 20px;
            margin-top: 15px;
        }

        .timer-display {
            font-size: 36px;
            font-weight: bold;
            color: var(--accent);
            margin: 10px 0;
            font-family: monospace;
        }

        /* Modal Overlay & Popups */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(4px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-window {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 25px;
            width: 90%;
            max-width: 350px;
            position: relative;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0,0,0,0.6);
        }

        .modal-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 15px;
        }

        .btn-close {
            position: absolute;
            top: 12px;
            right: 15px;
            background: none;
            border: none;
            color: var(--text-sub);
            font-size: 20px;
            cursor: pointer;
        }

        .key-list {
            max-height: 200px;
            overflow-y: auto;
            margin: 15px 0;
            text-align: left;
        }

        .key-item {
            background: var(--bg-color);
            border: 1px solid var(--border);
            padding: 10px;
            margin-bottom: 8px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
        }

        .btn-delete {
            background-color: var(--error);
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
        }

        .btn-delete:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2 class="title">RUONGTESTLINKVIP.COM</h2>

        <!-- Khung Nhập Key Người Dùng -->
        <div id="loginSection">
            <div class="input-group">
                <input type="text" id="keyInput" class="input-field" placeholder="Nhập key của bạn...">
            </div>
            
            <button class="btn-submit" id="holdBtn">
                KÍCH HOẠT KEY
                <span class="timer-badge" id="timerBadge">30s</span>
            </button>
            
            <div id="msgBox" class="message-box"></div>
        </div>

        <!-- Mẫu Hiển Thị Sau Khi Kích Hoạt Thành Công -->
        <div id="activeSection" style="display: none;">
            <div class="timer-box">
                <p style="color: var(--text-sub); font-size: 13px;">THỜI GIAN CÒN LẠI</p>
                <div class="timer-display" id="countdownDisplay">60:00</div>
                <p style="color: var(--success); font-size: 13px;">✓ Đã kích hoạt thành công!</p>
            </div>
        </div>
    </div>

    <!-- Modal Nhập Password Admin -->
    <div class="modal-overlay" id="adminAuthModal">
        <div class="modal-window">
            <button class="btn-close" onclick="closeModal('adminAuthModal')">&times;</button>
            <h3 class="modal-title">XÁC NHẬN ADMIN</h3>
            <div class="input-group">
                <input type="password" id="adminPassInput" class="input-field" placeholder="Nhập mật khẩu Admin...">
            </div>
            <button class="btn-submit" onclick="verifyAdminPassword()">XÁC NHẬN</button>
        </div>
    </div>

    <!-- Modal Bảng Quản Lý Admin -->
    <div class="modal-overlay" id="adminPanelModal">
        <div class="modal-window" style="max-width: 400px;">
            <button class="btn-close" onclick="closeModal('adminPanelModal')">&times;</button>
            <h3 class="modal-title">QUẢN LÝ KEY ADMIN</h3>
            <p style="font-size: 12px; color: var(--text-sub);">Danh sách key hiện có trên hệ thống:</p>
            
            <div class="key-list" id="keyListContainer"></div>
            
            <button class="btn-submit" onclick="closeModal('adminPanelModal')" style="background-color: var(--border);">ĐÓNG BẢNG</button>
        </div>
    </div>

<script>
    let holdTimer;
    let timeLeft = 30;
    let failCount = 0;
    const maxFails = 5;

    const holdBtn = document.getElementById('holdBtn');
    const timerBadge = document.getElementById('timerBadge');
    const msgBox = document.getElementById('msgBox');
    const keyInput = document.getElementById('keyInput');

    // Khởi tạo danh sách key mẫu nếu chưa lưu trong bộ nhớ
    if (!localStorage.getItem('savedKeysList')) {
        localStorage.setItem('savedKeysList', JSON.stringify([
            'KEYVIP-8888-9999',
            'KEYVIP-1234-5678',
            'KEYVIP-TEST-LINK'
        ]));
    }

    // Hiển thị thông báo
    function showMessage(text, type) {
        msgBox.className = `message-box ${type}`;
        msgBox.innerText = text;
    }

    // Xử lý giữ nút 30s vào Admin
    const startHold = (e) => {
        timeLeft = 30;
        timerBadge.innerText = `${timeLeft}s`;
        showMessage("Đang giữ... Giữ liên tục 30s để đăng nhập Admin!", "success");

        holdTimer = setInterval(() => {
            timeLeft--;
            timerBadge.innerText = `${timeLeft}s`;

            if (timeLeft <= 0) {
                clearInterval(holdTimer);
                msgBox.style.display = "none";
                timerBadge.innerText = "30s";
                
                // Mở Modal đăng nhập Admin
                document.getElementById('adminAuthModal').style.display = 'flex';
                document.getElementById('adminPassInput').value = '';
                document.getElementById('adminPassInput').focus();
            }
        }, 1000);
    };

    const cancelHold = () => {
        clearInterval(holdTimer);
        if (timeLeft > 0 && timeLeft < 30) {
            showMessage("Đã hủy! Bạn phải giữ liên tục đủ 30 giây.", "error");
            timerBadge.innerText = "30s";
        }
    };

    // Gán sự kiện giữ trên Máy tính & Điện thoại
    holdBtn.addEventListener('mousedown', startHold);
    holdBtn.addEventListener('mouseup', cancelHold);
    holdBtn.addEventListener('mouseleave', cancelHold);

    holdBtn.addEventListener('touchstart', startHold);
    holdBtn.addEventListener('touchend', cancelHold);

    // Kích hoạt key thường khi nhấp nhanh
    holdBtn.addEventListener('click', () => {
        if (timeLeft < 30 && timeLeft > 0) return; // Nếu đang trong thời gian giữ thì bỏ qua

        const enteredKey = keyInput.value.trim();
        if (!enteredKey) {
            showMessage("Vui lòng nhập key hợp lệ!", "error");
            return;
        }

        let savedKeys = JSON.parse(localStorage.getItem('savedKeysList')) || [];

        if (savedKeys.includes(enteredKey)) {
            // Nhập đúng Key -> Hiện đếm ngược 60:00
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('activeSection').style.display = 'block';
            startSessionTimer(60 * 60);
        } else {
            // Sai Key
            failCount++;
            if (failCount >= maxFails) {
                showMessage(`Key không tồn tại hoặc đã hết hạn! (${failCount}/${maxFails})`, "error");
            } else {
                showMessage(`Key đã được sử dụng hoặc sai key, vui lòng thử lại! (${failCount}/${maxFails})`, "error");
            }
        }
    });

    // Xác nhận mật khẩu Admin
    function verifyAdminPassword() {
        const pass = document.getElementById('adminPassInput').value.trim();
        if (pass === "THUANDEPTRAI") {
            closeModal('adminAuthModal');
            openAdminPanel();
        } else {
            alert("Sai mật khẩu Admin!");
        }
    }

    // Bảng quản lý Key Admin
    function openAdminPanel() {
        document.getElementById('adminPanelModal').style.display = 'flex';
        renderKeyList();
    }

    function renderKeyList() {
        let keys = JSON.parse(localStorage.getItem('savedKeysList')) || [];
        const container = document.getElementById('keyListContainer');

        if (keys.length === 0) {
            container.innerHTML = '<p style="font-size: 13px; color: var(--text-sub); text-align: center;">Không còn key nào trong hệ thống.</p>';
            return;
        }

        let html = '';
        keys.forEach((k, index) => {
            html += `
                <div class="key-item">
                    <span>${k}</span>
                    <button class="btn-delete" onclick="deleteKey(${index})">Xóa</button>
                </div>
            `;
        });
        container.innerHTML = html;
    }

    function deleteKey(index) {
        let keys = JSON.parse(localStorage.getItem('savedKeysList')) || [];
        keys.splice(index, 1);
        localStorage.setItem('savedKeysList', JSON.stringify(keys));
        renderKeyList();
    }

    function closeModal(id) {
        document.getElementById(id).style.display = 'none';
    }

    // Bộ đếm ngược 60 phút cho key thành công
    function startSessionTimer(duration) {
        let timer = duration, minutes, seconds;
        const display = document.getElementById('countdownDisplay');
        setInterval(() => {
            minutes = parseInt(timer / 60, 10);
            seconds = parseInt(timer % 60, 10);

            minutes = minutes < 10 ? "0" + minutes : minutes;
            seconds = seconds < 10 ? "0" + seconds : seconds;

            display.textContent = minutes + ":" + seconds;

            if (--timer < 0) {
                timer = 0;
            }
        }, 1000);
    }
</script>

</body>
</html>
